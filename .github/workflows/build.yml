name: Build desktop app

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  linux:
    name: Linux x86_64
    runs-on: ubuntu-22.04
    env:
      APPIMAGE_EXTRACT_AND_RUN: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libgirepository1.0-dev libcairo2-dev pkg-config \
            gir1.2-webkit2-4.1 libwebkit2gtk-4.1-0 xvfb imagemagick

      - name: Python packages
        run: pip install -r requirements-desktop.txt

      - name: Unit tests
        run: python -m pytest -q tests

      - name: appimagetool
        run: |
          curl -fsSL -o /usr/local/bin/appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /usr/local/bin/appimagetool

      - name: Build AppImage
        run: VERSION="${GITHUB_REF_NAME}" packaging/build_linux.sh
        env:
          GITHUB_REF_NAME: ${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}

      - name: Window test (virtual screen)
        run: packaging/ci_window_test_linux.sh dist/*.AppImage linux-22.04.png

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: dist/*.AppImage
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshot-linux-22.04
          path: linux-22.04.png
          if-no-files-found: ignore

  linux-portability:
    name: Linux AppImage on Ubuntu 24.04
    needs: linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: System packages (runtime only)
        run: |
          sudo apt-get update
          sudo apt-get install -y gir1.2-webkit2-4.1 libwebkit2gtk-4.1-0 xvfb imagemagick

      - uses: actions/download-artifact@v4
        with:
          name: linux-x86_64
          path: dist

      - name: Window test (virtual screen)
        run: |
          chmod +x dist/*.AppImage
          packaging/ci_window_test_linux.sh dist/*.AppImage linux-24.04.png

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshot-linux-24.04
          path: linux-24.04.png
          if-no-files-found: ignore
